<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynasty Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: scoreboard band header, tabbed front-office ledger below; cards only for trades and matchups */
:root{
  --bg:#eef2f0;--surface:#ffffff;--sunk:#e3e9e6;--ink:#13201a;--muted:#5a6a63;--line:#d3ddd8;
  --accent:#17734a;--accent-ink:#ffffff;--gold:#946208;--gold-bg:#fbf0d8;--win:#17734a;--loss:#b4423a;
  --band:#0f2419;--band-ink:#e6f1eb;--band-muted:#93ae9f;
  --qb:#d23c63;--rb:#178f82;--wr:#2f76c2;--te:#d27a1f;--k:#7a5fc4;--def:#7d5f45;
  --display:'Saira Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1210;--surface:#141c19;--sunk:#1a2420;--ink:#e2eae6;--muted:#8c9e96;--line:#26332e;
  --accent:#45c48a;--accent-ink:#06130d;--gold:#e3a93f;--gold-bg:#2a2214;--win:#45c48a;--loss:#e27166;
  --band:#08130e;--band-ink:#e6f1eb;--band-muted:#7f9a8b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1210;--surface:#141c19;--sunk:#1a2420;--ink:#e2eae6;--muted:#8c9e96;--line:#26332e;
  --accent:#45c48a;--accent-ink:#06130d;--gold:#e3a93f;--gold-bg:#2a2214;--win:#45c48a;--loss:#e27166;
  --band:#08130e;--band-ink:#e6f1eb;--band-muted:#7f9a8b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--band);color:var(--band-ink)}
.band-in{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;padding-block:20px 14px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mark{width:46px;height:46px;border:2px solid var(--band-ink);border-radius:6px;display:grid;place-items:center;font:700 22px/1 var(--display);letter-spacing:.02em;flex:none}
.brand h1{margin:0;font:700 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--band-muted);font-size:13px}
#connect{display:flex;gap:8px;flex-wrap:wrap}
#connect input{background:transparent;border:1px solid var(--band-muted);border-radius:6px;padding:8px 12px;color:var(--band-ink);min-width:0;width:260px;max-width:100%}
#connect input::placeholder{color:var(--band-muted)}
.btn{border:1px solid var(--band-ink);background:var(--band-ink);color:var(--band);border-radius:6px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--band-ink);border-color:var(--band-muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--band-muted);padding:10px 14px 9px;font:600 16px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--accent)}

main{padding-block:24px 64px}
.status{padding:40px 0;color:var(--muted)}
.status b{color:var(--ink)}
.err{color:var(--loss)}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;max-width:420px;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}

h2.sec{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px;max-width:70ch}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field select,.field input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
.field input{width:220px}
.count{color:var(--muted);font-size:13px;margin-left:auto}

/* trades */
.trades{display:flex;flex-direction:column;gap:14px}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.trade>header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.trade .when{font:600 17px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.trade .tag{color:var(--muted);font-size:13px}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.side{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.side+.side{border-left:1px solid var(--line)}
@media (max-width:600px){.side+.side{border-left:0;border-top:1px solid var(--line)}}
.team{display:flex;gap:10px;align-items:center;min-width:0}
.team b{font-weight:600;overflow-wrap:anywhere}
.team small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.av{width:30px;height:30px;border-radius:50%;flex:none;background:var(--sunk);display:grid;place-items:center;font:600 12px/1 var(--display);color:var(--muted);overflow:hidden;object-fit:cover}
.assets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.asset{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.asset:hover{border-color:var(--accent)}
.asset .nm{font-weight:500;overflow-wrap:anywhere}
.asset .nfl{color:var(--muted);font-size:12px}
.asset .moved{margin-left:auto;font-size:11px;color:var(--muted)}
.pos{font:600 11px/1 var(--mono);padding:3px 5px;border-radius:3px;color:#fff;background:var(--muted);min-width:34px;text-align:center}
.pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}.pos.TE{background:var(--te)}.pos.K{background:var(--k)}.pos.DEF{background:var(--def)}
.asset.pick{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:var(--gold-bg)}
.pos.PK{background:var(--gold);color:var(--surface)}
.became{flex-basis:100%;font-size:13px;color:var(--muted);padding-left:42px}
.became b{color:var(--ink);font-weight:600}
.faab{font-size:13px;color:var(--muted);padding:2px 0}
.prod{margin-top:auto;padding-top:6px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line)}
.prod .num{color:var(--ink);font-size:13px}
.prod.lead .num{color:var(--win);font-weight:600}
.trade>header .edge{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.trade>header .edge b{color:var(--win)}
.tlink{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left}
.tlink:hover .who{color:var(--accent)}
.drawer .trade .sides{grid-template-columns:1fr}
.drawer .side+.side{border-left:0;border-top:1px solid var(--line)}
.more{display:block;margin:18px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 18px;font-weight:600}

/* tables */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.matrix td,.matrix th{text-align:center;padding:6px}
.matrix th.rowh{text-align:left;position:sticky;left:0;background:var(--sunk);z-index:1}
.cell{border:0;border-radius:4px;padding:6px 8px;min-width:58px;font:500 13px/1 var(--mono);background:var(--sunk)}
.cell.sel{outline:2px solid var(--ink)}
.cell.self{background:none;color:var(--line);cursor:default}

/* h2h */
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin:20px 0 14px}
.pair .side-a{text-align:right}
.pair .side-a .team{justify-content:flex-end}
.big{font:700 44px/1 var(--display);letter-spacing:.02em}
.big .dash{color:var(--muted);padding:0 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .v{font:600 20px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);font-family:var(--body)}
.w{color:var(--win);font-weight:600}.l{color:var(--loss);font-weight:600}
.po{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:1px 4px;margin-left:6px}

/* history */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 10px;font:700 17px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank li:last-child{border-bottom:0}
.rank .who{min-width:0;overflow-wrap:anywhere}
.rank .who small{display:block;color:var(--muted);font-size:12px}
.trophy{font:700 13px/1 var(--display);color:var(--gold);letter-spacing:.06em;text-transform:uppercase}

/* week */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.game .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.game .score{font:600 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.game .row.lead .score{color:var(--win)}
.game .foot{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--win)}

/* league picker */
.picker{display:flex;flex-direction:column;gap:8px;max-width:560px}
.picker button{display:flex;justify-content:space-between;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.picker button:hover{border-color:var(--accent)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer>header{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer>header .t{flex:1;font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;min-width:0;overflow-wrap:anywhere}
.icon{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.dbody{overflow-y:auto;padding:16px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:16px}
.tl>li{position:relative}
.tl>li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl>li.draft::before{border-color:var(--gold);background:var(--gold)}
.tl>li.now::before{background:var(--accent)}
.tl>li.wv::before{border-color:var(--muted)}
.rank .tlink{display:inline;width:auto;font-size:12px;text-decoration:underline;margin-top:2px}
.tl .d{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tl .h{font-weight:600;margin:2px 0 6px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.mini .ms{display:flex;flex-direction:column;gap:4px}
.mini .ms>span{font-size:12px;color:var(--muted)}
.mini .asset{padding:4px 6px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="band">
  <div class="wrap band-in">
    <div class="brand">
      <div class="mark" aria-hidden="true">DL</div>
      <div><h1 id="lgName">Dynasty Ledger</h1><p id="lgMeta">Load a Sleeper league to begin</p></div>
    </div>
    <form id="connect" autocomplete="off">
      <input id="lid" aria-label="League ID or Sleeper username" placeholder="League ID or Sleeper username">
      <button class="btn" type="submit">Load</button>
      <button class="btn ghost" type="button" id="refresh" hidden>Refresh</button>
    </form>
  </div>
  <nav class="wrap tabs" role="tablist" id="tabs" hidden>
    <button class="tab" role="tab" data-view="trades">Trades</button>
    <button class="tab" role="tab" data-view="rank">Trade Rankings</button>
    <button class="tab" role="tab" data-view="wire">Waiver Wire</button>
    <button class="tab" role="tab" data-view="h2h">Head to Head</button>
    <button class="tab" role="tab" data-view="history">League History</button>
    <button class="tab" role="tab" data-view="week">This Week</button>
  </nav>
</div>
<main class="wrap" id="main">
  <div class="status">
    <p><b>Enter your league ID</b> (the long number in your Sleeper league URL, sleeper.com/leagues/<span class="num">123456789012345678</span>) or your Sleeper username to pick from your leagues.</p>
    <p>History is pulled back through every previous season linked to the league.</p>
  </div>
</main>
<div id="drawerRoot"></div>

<script>
const API='https://api.sleeper.app/v1';
const CACHE_V=5;
const DEFAULT_LEAGUE=''; // optional: paste your league ID here so the page opens on it
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const fmt1=n=>(Math.round(n*10)/10).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtDate=t=>t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';

async function api(p){
  const r=await fetch(API+p);
  if(!r.ok) throw new Error(`Sleeper returned ${r.status} for ${p}`);
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function pool(items,n,fn){
  const out=new Array(items.length);let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;out[k]=await fn(items[k],k)}}));
  return out;
}

let D=null, view='trades', liveTimer=null, loading=false;
const ui={team:'',season:'',q:'',sort:'new',metric:'total',limit:40,a:null,b:null,wSeason:'',wTeam:''};
const prog={done:0,total:1,msg:''};

function setStatus(msg,err){
  $('#main').innerHTML=`<div class="status"><p class="${err?'err':''}">${msg}</p>${err?'':`<div class="bar"><i style="width:${Math.round(100*prog.done/Math.max(1,prog.total))}%"></i></div>`}</div>`;
}
function tick(){prog.done++; if(prog.done%4===0||prog.done===prog.total) setStatus(prog.msg)}

/* ---------- loading ---------- */
async function loadPlayers(){
  const c=store.get('slp_players');
  if(c&&c.m&&Date.now()-c.t<864e5) return c.m;
  prog.msg='Downloading the NFL player list (cached for a day)...'; setStatus(prog.msg);
  try{
    const raw=await api('/players/nfl'); const m={};
    for(const [id,p] of Object.entries(raw||{})){
      const n=p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ');
      if(!n) continue;
      m[id]=[n,p.position||(p.fantasy_positions||[])[0]||'',p.team||''];
    }
    store.set('slp_players',{t:Date.now(),m}); return m;
  }catch(e){ return c?.m||{} }
}

async function loadSeason(lg,state){
  const id=lg.league_id;
  const key='slp_s_'+id;
  if(lg.status==='complete'){const c=store.get(key); if(c&&c.v===CACHE_V){prog.done+=37;return c}}
  const isCur=lg.status!=='complete';
  let lastWeek=18;
  if(isCur) lastWeek=(lg.status==='in_season'||lg.status==='post_season')&&String(state.season)===String(lg.season)?Math.min(18,Number(state.week)||0):0;
  const [users,rosters,drafts,bracket]=await Promise.all([
    api(`/league/${id}/users`),api(`/league/${id}/rosters`),
    api(`/league/${id}/drafts`).catch(()=>[]),api(`/league/${id}/winners_bracket`).catch(()=>[])
  ]);
  const weeks=range(1,lastWeek);
  prog.total+=weeks.length-18;
  const mres=await pool(weeks,6,async w=>{
    const r=await api(`/league/${id}/matchups/${w}`).catch(()=>[]);tick();
    return [w,(r||[]).map(m=>({rid:m.roster_id,mid:m.matchup_id,pts:Number(m.custom_points??m.points??0),st:m.starters||[],sp:m.starters_points||[],pp:m.players_points||{}}))];
  });
  const tres=await pool(range(0,18),6,async w=>{
    const r=await api(`/league/${id}/transactions/${w}`).catch(()=>[]);tick();
    return r||[];
  });
  const dd=await pool(drafts||[],3,async d=>{
    const [full,picks]=await Promise.all([api('/draft/'+d.draft_id).catch(()=>d),api(`/draft/${d.draft_id}/picks`).catch(()=>[])]);
    return {id:d.draft_id,season:String(full.season||lg.season),type:full.type,status:full.status,start:full.start_time||0,
      slots:full.slot_to_roster_id||{},order:full.draft_order||{},teams:full.settings?.teams||lg.total_rosters,
      picks:(picks||[]).map(p=>({r:p.round,no:p.pick_no,slot:p.draft_slot,rid:p.roster_id,pid:p.player_id,
        name:[p.metadata?.first_name,p.metadata?.last_name].filter(Boolean).join(' '),pos:p.metadata?.position||'',team:p.metadata?.team||''}))};
  });
  const seen=new Set();const trades=[],moves=[];
  for(const arr of tres) for(const t of arr){
    if(seen.has(t.transaction_id)) continue; seen.add(t.transaction_id);
    const created=t.status_updated||t.created;
    if(t.type==='trade'&&t.status==='complete') trades.push({id:t.transaction_id,created,leg:t.leg,rids:t.roster_ids||[],adds:t.adds||{},drops:t.drops||{},picks:t.draft_picks||[],faab:t.waiver_budget||[]});
    else if((t.type==='waiver'||t.type==='free_agent')&&(t.status==='complete'||t.status==='failed'))
      moves.push({id:t.transaction_id,type:t.type,status:t.status,created,leg:t.leg,rid:(t.roster_ids||[])[0],adds:Object.keys(t.adds||{}),drops:Object.keys(t.drops||{}),bid:Number(t.settings?.waiver_bid)||0});
  }
  const out={v:CACHE_V,users:(users||[]).map(u=>({id:u.user_id,dn:u.display_name,tn:u.metadata?.team_name||'',av:u.metadata?.avatar||(u.avatar?`https://sleepercdn.com/avatars/thumbs/${u.avatar}`:'')})),
    rosters:(rosters||[]).map(r=>({rid:r.roster_id,owner:r.owner_id,players:r.players||[],s:r.settings||{}})),
    matchups:Object.fromEntries(mres),trades,moves,drafts:dd,bracket:bracket||[]};
  if(lg.status==='complete') store.set(key,out);
  return out;
}

async function loadLeague(leagueId,quiet){
  if(loading) return; loading=true;
  clearInterval(liveTimer);
  try{
    prog.done=0;prog.total=1;prog.msg='Finding your league...'; if(!quiet) setStatus(prog.msg);
    const state=await api('/state/nfl');
    const chain=[];let id=leagueId;
    while(id&&id!=='0'&&chain.length<15){
      const lg=await api('/league/'+id);
      if(!lg) {if(!chain.length) throw new Error('No league found with that ID.'); break}
      chain.push(lg); id=lg.previous_league_id;
    }
    chain.reverse();
    const players=await loadPlayers();
    prog.done=0;prog.total=chain.length*37;
    const seasons=[];
    for(const lg of chain){
      prog.msg=`Loading the ${lg.season} season...`; if(!quiet) setStatus(prog.msg);
      const data=await loadSeason(lg,state);
      seasons.push({...data,league:lg,season:String(lg.season)});
    }
    D=build(seasons,state,players);
    store.set('slp_league',leagueId);
    try{const u=new URL(location.href);u.searchParams.set('league',leagueId);history.replaceState(null,'',u.toString())}catch(e){}
    $('#lid').value=leagueId;
    $('#refresh').hidden=false;$('#tabs').hidden=false;
    $('#lgName').textContent=D.cur.league.name;
    $('#lgMeta').textContent=`${D.cur.season} season · ${D.frs.length} teams · ${seasons.length} season${seasons.length>1?'s':''} of history · updated ${new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`;
    if(ui.a==null){ui.a=D.frs[0]?.rid;ui.b=D.frs[1]?.rid}
    route();
  }catch(e){
    setStatus(esc(e.message||String(e))+' Check the league ID and try again.',true);
  }finally{loading=false}
}

async function findLeagues(username){
  setStatus('Looking up '+esc(username)+'...');
  try{
    const u=await api('/user/'+encodeURIComponent(username));
    if(!u) throw new Error('No Sleeper user with that username.');
    const st=await api('/state/nfl');
    let lgs=await api(`/user/${u.user_id}/leagues/nfl/${st.season}`)||[];
    if(!lgs.length) lgs=await api(`/user/${u.user_id}/leagues/nfl/${Number(st.season)-1}`)||[];
    if(!lgs.length) throw new Error('That user has no NFL leagues this season.');
    lgs.sort((a,b)=>(b.settings?.type===2)-(a.settings?.type===2));
    $('#main').innerHTML=`<h2 class="sec">Pick a league</h2><p class="sub">Leagues for ${esc(u.display_name)} in ${esc(lgs[0].season)}. Dynasty leagues are listed first.</p>
      <div class="picker">${lgs.map(l=>`<button data-league="${esc(l.league_id)}"><span><b>${esc(l.name)}</b><br><small class="sub">${l.total_rosters} teams</small></span><span class="lbl">${l.settings?.type===2?'Dynasty':l.settings?.type===1?'Keeper':'Redraft'}</span></button>`).join('')}</div>`;
  }catch(e){setStatus(esc(e.message),true)}
}

/* ---------- model ---------- */
function build(seasons,state,players){
  const names={};
  const S={};
  for(const s of seasons){
    const ub=Object.fromEntries(s.users.map(u=>[u.id,u]));
    const rb=Object.fromEntries(s.rosters.map(r=>[r.rid,r]));
    s.team=rid=>{const r=rb[rid];const u=r&&ub[r.owner];return {rid,name:u?.tn||u?.dn||`Team ${rid}`,owner:u?.dn||'No manager',av:u?.av||''}};
    s.ownerUid=rid=>rb[rid]?.owner;
    s.uidToRid=uid=>s.rosters.find(r=>r.owner===uid)?.rid;
    S[s.season]=s;
  }
  const cur=seasons[seasons.length-1];
  const frs=cur.rosters.map(r=>cur.team(r.rid)).sort((a,b)=>a.rid-b.rid);
  const tname=(season,rid)=>(S[season]||cur).team(rid);

  // live week to exclude from records
  const liveKey=(cur.league.status==='in_season'||cur.league.status==='post_season')&&String(state.season)===cur.season?Number(cur.season)*100+Number(state.week):Infinity;

  // games
  const games=[];
  for(const s of seasons){
    const pws=Number(s.league.settings?.playoff_week_start)||15;
    for(const [w,arr] of Object.entries(s.matchups)){
      const wk=Number(w);
      if(Number(s.season)*100+wk>=liveKey) continue;
      if(wk<pws){
        const g={};
        for(const m of arr){if(m.mid==null)continue;(g[m.mid]=g[m.mid]||[]).push(m)}
        for(const pair of Object.values(g)){
          if(pair.length!==2) continue;
          if(!pair[0].pts&&!pair[1].pts) continue;
          games.push({season:s.season,week:wk,po:false,a:{rid:pair[0].rid,pts:pair[0].pts},b:{rid:pair[1].rid,pts:pair[1].pts}});
        }
      }
    }
    for(const b of s.bracket){
      if(b.w==null||typeof b.t1!=='number'||typeof b.t2!=='number') continue;
      const wk=pws+b.r-1;
      if(Number(s.season)*100+wk>=liveKey) continue;
      const arr=s.matchups[wk]||[];
      const p1=arr.find(m=>m.rid===b.t1)?.pts??0,p2=arr.find(m=>m.rid===b.t2)?.pts??0;
      games.push({season:s.season,week:wk,po:true,final:b.p===1,round:b.r,a:{rid:b.t1,pts:p1},b:{rid:b.t2,pts:p2}});
    }
  }
  const champs=seasons.map(s=>{const f=s.bracket.find(b=>b.p===1&&b.w!=null);return f?{season:s.season,w:f.w,l:f.l}:null}).filter(Boolean);

  // starters index
  const st={};
  for(const s of seasons) for(const [w,arr] of Object.entries(s.matchups)){
    const key=Number(s.season)*100+Number(w);
    if(key>=liveKey) continue;
    for(const m of arr){
      const sp={};m.st.forEach((pid,i)=>{if(pid&&pid!=='0')sp[pid]=Number(m.sp[i])||0});
      const ids=new Set([...Object.keys(m.pp||{}),...Object.keys(sp)]);
      for(const pid of ids) (st[pid]=st[pid]||[]).push({k:key,rid:m.rid,t:Number(m.pp?.[pid]??sp[pid]??0),s:pid in sp,p:sp[pid]||0});
    }
  }

  // drafts: pick index and drafted-by
  const pickIndex={},draftedBy={};
  for(const s of seasons) for(const d of s.drafts){
    const slotUid={};for(const [uid,slot] of Object.entries(d.order||{})) slotUid[slot]=uid;
    for(const p of d.picks){
      if(p.pid&&p.name&&!players[p.pid]) names[p.pid]=[p.name,p.pos,p.team];
      let orig=d.slots[p.slot]??d.slots[String(p.slot)];
      if(orig==null&&slotUid[p.slot]) orig=s.uidToRid(slotUid[p.slot]);
      const teams=Number(d.teams)||frs.length||12;
      const e={season:d.season,round:p.r,no:p.no,label:`${p.r}.${String(((p.no-1)%teams)+1).padStart(2,'0')}`,rid:p.rid,orig:orig!=null?Number(orig):null,pid:p.pid,start:d.start,type:d.type};
      if(e.orig!=null){const key=`${d.season}-${p.r}-${e.orig}`; if(!pickIndex[key]||d.type!=='auction') pickIndex[key]=e}
      if(p.pid) draftedBy[p.pid]=e;
    }
  }
  for(const e of Object.values(draftedBy)) e.key=e.orig!=null?`${e.season}-${e.round}-${e.orig}`:null;

  // trades
  const trades=[];
  for(const s of seasons) for(const t of s.trades){
    const sides={};
    const side=rid=>sides[rid]=sides[rid]||{rid,players:[],picks:[],faab:0};
    t.rids.forEach(side);
    for(const [pid,rid] of Object.entries(t.adds)) side(rid).players.push(pid);
    for(const p of t.picks) side(p.owner_id).picks.push({season:String(p.season),round:p.round,orig:p.roster_id,from:p.previous_owner_id,key:`${p.season}-${p.round}-${p.roster_id}`});
    for(const f of t.faab) side(f.receiver).faab+=Number(f.amount)||0;
    trades.push({id:t.id,season:s.season,week:Number(t.leg)||0,created:t.created,drops:t.drops,sides:Object.values(sides).sort((a,b)=>a.rid-b.rid)});
  }
  trades.sort((a,b)=>a.created-b.created);
  const playerTrades={},pickTrades={};
  trades.forEach((t,i)=>{t.i=i;for(const sd of t.sides){sd.players.forEach(p=>(playerTrades[p]=playerTrades[p]||[]).push(i));sd.picks.forEach(p=>(pickTrades[p.key]=pickTrades[p.key]||[]).push(i))}});

  const moves=[];
  for(const s of seasons) for(const m of (s.moves||[])){const wk=Number(m.leg)||0;moves.push({...m,season:s.season,week:wk,k:Number(s.season)*100+wk})}
  moves.sort((a,b)=>a.created-b.created);
  const leaves={},movesByPid={};
  for(const m of moves){
    for(const pid of new Set([...m.adds,...m.drops])) (movesByPid[pid]=movesByPid[pid]||[]).push(m);
    if(m.status==='complete') for(const pid of m.drops) (leaves[pid]=leaves[pid]||[]).push({created:m.created,rid:m.rid,k:m.k,trade:null});
  }
  for(const t of trades) for(const [pid,rid] of Object.entries(t.drops||{})) (leaves[pid]=leaves[pid]||[]).push({created:t.created,rid:Number(rid),k:Number(t.season)*100+t.week,trade:t.id});
  for(const a of Object.values(leaves)) a.sort((x,y)=>x.created-y.created);

  const holder={};
  for(const r of cur.rosters) for(const p of r.players) holder[p]=r.rid;

  return {seasons,S,cur,frs,tname,games,champs,st,pickIndex,draftedBy,trades,playerTrades,pickTrades,moves,leaves,movesByPid,holder,players,names,state,prodMemo:{}};
}

const P=pid=>D.players[pid]||D.names[pid]||[/^[A-Z]{2,3}$/.test(pid)?pid+' D/ST':'Player '+pid,/^[A-Z]{2,3}$/.test(pid)?'DEF':'',''];
const frName=rid=>D.cur.team(rid).name;

function nextTradeKey(pid,afterCreated){
  for(const i of D.playerTrades[pid]||[]){const t=D.trades[i];if(t.created>afterCreated) return Number(t.season)*100+t.week}
  return Infinity;
}
function sumProd(pid,rid,from,to,metric){let s=0;for(const e of D.st[pid]||[]) if(e.rid===rid&&e.k>=from&&e.k<to) s+=metric==='start'?e.p:e.t;return s}
function sideProd(t,sd,metric=ui.metric){
  const mk=t.id+'-'+sd.rid+'-'+metric; if(mk in D.prodMemo) return D.prodMemo[mk];
  const start=Number(t.season)*100+t.week;let tot=0;
  for(const pid of sd.players) tot+=sumProd(pid,sd.rid,start,nextTradeKey(pid,t.created),metric);
  for(const pk of sd.picks){
    const e=D.pickIndex[pk.key];
    if(e&&e.pid&&e.rid===sd.rid) tot+=sumProd(e.pid,sd.rid,Number(e.season)*100,nextTradeKey(e.pid,e.start||0),metric);
  }
  return D.prodMemo[mk]=tot;
}
const pending=t=>t.sides.some(sd=>sd.picks.some(pk=>!D.pickIndex[pk.key]?.pid));
function tradeScore(t,metric=ui.metric){
  const v=t.sides.map(sd=>({rid:sd.rid,p:sideProd(t,sd,metric)})).sort((a,b)=>b.p-a.p);
  const total=v.reduce((s,x)=>s+x.p,0);
  return {win:v[0],margin:v.length>1?v[0].p-v[1].p:0,total,pending:pending(t)};
}
const METRIC_LBL={total:'Fantasy pts while rostered',start:'Pts in starting lineup'};

/* ---------- rendering helpers ---------- */
function av(t){
  const ini=esc((t.name||'?').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?');
  return t.av?`<img class="av" src="${esc(t.av)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;av&quot;>${ini}</span>'">`:`<span class="av">${ini}</span>`;
}
function teamBlock(t,sub){return `<div class="team">${av(t)}<div><b>${esc(t.name)}</b><small>${esc(sub??t.owner)}</small></div></div>`}
function playerChip(pid,extra=''){
  const [n,pos,nfl]=P(pid);
  return `<button class="asset" data-asset="p:${esc(pid)}"><span class="pos ${esc(pos)}">${esc(pos||'?')}</span><span class="nm">${esc(n)}</span>${nfl?`<span class="nfl">${esc(nfl)}</span>`:''}${extra}</button>`;
}
function pickChip(pk,seasonCtx){
  const e=D.pickIndex[pk.key];
  const orig=D.tname(pk.season in D.S?pk.season:seasonCtx,pk.orig).name;
  let became='';
  if(e&&e.pid){const [n,pos]=P(e.pid);became=`<span class="became">Used at ${esc(e.label)} on <b>${esc(n)}</b> ${esc(pos)}</span>`}
  else if(e) became=`<span class="became">Pick ${esc(e.label)}, not used yet</span>`;
  else became=`<span class="became">Not drafted yet</span>`;
  const n=(D.pickTrades[pk.key]||[]).length;
  return `<button class="asset pick" data-asset="k:${esc(pk.key)}"><span class="pos PK">PICK</span><span class="nm">${esc(pk.season)} Round ${pk.round}</span><span class="nfl">via ${esc(orig)}</span>${n>1?`<span class="moved">traded ${n}x</span>`:''}${became}</button>`;
}
function sideAssets(t,sd){
  const items=[...sd.players.map(pid=>{const n=(D.playerTrades[pid]||[]).length;return `<li>${playerChip(pid,n>1?`<span class="moved">traded ${n}x</span>`:'')}</li>`}),
    ...sd.picks.sort((a,b)=>a.season-b.season||a.round-b.round).map(pk=>`<li>${pickChip(pk,t.season)}</li>`)];
  if(sd.faab) items.push(`<li class="faab">$${sd.faab} FAAB</li>`);
  if(!items.length) items.push(`<li class="faab">Nothing</li>`);
  return `<ul class="assets">${items.join('')}</ul>`;
}

/* ---------- views ---------- */
function renderTrades(){
  let T=D.trades.slice();
  if(ui.team) T=T.filter(t=>t.sides.some(s=>String(s.rid)===ui.team));
  if(ui.season) T=T.filter(t=>t.season===ui.season);
  if(ui.q){const q=ui.q.toLowerCase();T=T.filter(t=>t.sides.some(s=>s.players.some(p=>P(p)[0].toLowerCase().includes(q))||s.picks.some(pk=>{const e=D.pickIndex[pk.key];return e?.pid&&P(e.pid)[0].toLowerCase().includes(q)})))}
  if(ui.sort==='new') T.reverse();
  else if(ui.sort==='lop') T.sort((a,b)=>tradeScore(b).margin-tradeScore(a).margin);
  else if(ui.sort==='big') T.sort((a,b)=>tradeScore(b).total-tradeScore(a).total);
  const shown=T.slice(0,ui.limit);
  const seasons=[...new Set(D.trades.map(t=>t.season))].sort().reverse();
  $('#main').innerHTML=`
  <h2 class="sec">Trade history</h2>
  <p class="sub">Every completed trade since the league started. Tap any player or pick to follow where it went next. Traded picks show who was drafted with them. Points use your league's scoring and count only weeks the asset was on the new team, stopping if it was flipped.</p>
  <div class="controls">
    <label class="field"><span class="lbl">Team</span><select id="fTeam"><option value="">All teams</option>${D.frs.map(f=>`<option value="${f.rid}" ${String(f.rid)===ui.team?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>
    <label class="field"><span class="lbl">Season</span><select id="fSeason"><option value="">All seasons</option>${seasons.map(s=>`<option ${s===ui.season?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="field"><span class="lbl">Player</span><input id="fQ" type="search" placeholder="Search a player" value="${esc(ui.q)}"></label>
    <label class="field"><span class="lbl">Order</span><select id="fSort">${[['new','Newest first'],['old','Oldest first'],['lop','Most lopsided'],['big','Most total production']].map(([v,l])=>`<option value="${v}" ${ui.sort===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="field"><span class="lbl">Score by</span><select id="fMetric">${Object.entries(METRIC_LBL).map(([v,l])=>`<option value="${v}" ${ui.metric===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <span class="count">${T.length} trade${T.length===1?'':'s'}</span>
  </div>
  <div class="trades">${shown.map(tradeCard).join('')||'<p class="status">No trades match these filters.</p>'}</div>
  ${T.length>shown.length?`<button class="more" id="more">Show ${Math.min(40,T.length-shown.length)} more</button>`:''}`;
  $('#fTeam').onchange=e=>{ui.team=e.target.value;ui.limit=40;renderTrades()};
  $('#fSeason').onchange=e=>{ui.season=e.target.value;ui.limit=40;renderTrades()};
  $('#fSort').onchange=e=>{ui.sort=e.target.value;renderTrades()};
  $('#fMetric').onchange=e=>{ui.metric=e.target.value;renderTrades()};
  let to;$('#fQ').oninput=e=>{clearTimeout(to);to=setTimeout(()=>{ui.q=e.target.value.trim();ui.limit=40;renderTrades();const i=$('#fQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  const m=$('#more');if(m)m.onclick=()=>{ui.limit+=40;renderTrades()};
}
function tradeCard(t){
  const prods=t.sides.map(sd=>sideProd(t,sd));const max=Math.max(...prods);const sc=tradeScore(t);
  return `<article class="trade" id="t-${esc(t.id)}">
    <header><span class="when">${fmtDate(t.created)}</span><span class="tag">${t.season} season${t.week?` · week ${t.week}`:''}</span>
    <span class="edge">${sc.margin>0?`${esc(D.tname(t.season,sc.win.rid).name)} <b class="num">+${fmt1(sc.margin)}</b>`:'Even so far'}${sc.pending?'<span class="po">Picks pending</span>':''}</span></header>
    <div class="sides">${t.sides.map((sd,i)=>`<section class="side">
      ${teamBlock(D.tname(t.season,sd.rid))}
      <p class="lbl">Received</p>${sideAssets(t,sd)}
      <div class="prod ${prods[i]===max&&max>0&&t.sides.length>1?'lead':''}"><span>${METRIC_LBL[ui.metric]}</span><span class="num">${fmt1(prods[i])}</span></div>
    </section>`).join('')}</div></article>`;
}

function renderRankings(){
  const T=D.trades.filter(t=>t.sides.length>1);
  const sc=T.map(t=>({t,...tradeScore(t)}));
  const lop=sc.filter(x=>x.margin>0).sort((a,b)=>b.margin-a.margin).slice(0,10);
  const big=sc.slice().sort((a,b)=>b.total-a.total).slice(0,10);
  const net={};for(const f of D.frs) net[f.rid]={rid:f.rid,n:0,w:0,l:0,got:0,gave:0};
  for(const x of sc){
    const n=x.t.sides.length;
    for(const sd of x.t.sides){
      const r=net[sd.rid]||(net[sd.rid]={rid:sd.rid,n:0,w:0,l:0,got:0,gave:0});
      const mine=sideProd(x.t,sd),others=x.t.sides.filter(o=>o!==sd).reduce((s,o)=>s+sideProd(x.t,o),0)/(n-1);
      r.n++;r.got+=mine;r.gave+=others;if(mine>others)r.w++;else if(mine<others)r.l++;
    }
  }
  const rows=Object.values(net).sort((a,b)=>(b.got-b.gave)-(a.got-a.gave));
  const line=(x,v)=>`<li><button class="tlink" data-trade="${esc(x.t.id)}"><span class="who">${x.t.sides.map(sd=>esc(D.tname(x.t.season,sd.rid).name)).join(' / ')}<small>${fmtDate(x.t.created)}${x.margin>0?' · edge '+esc(D.tname(x.t.season,x.win.rid).name):''}${x.pending?' · picks pending':''}</small></span><span class="num">${v}</span></button></li>`;
  $('#main').innerHTML=`
  <h2 class="sec">Trade rankings</h2>
  <p class="sub">Scored with your league's scoring settings. Each side gets the points its incoming players produced for that team, plus players later drafted with incoming picks. Recent trades and trades with unused picks are still in progress.</p>
  <div class="controls"><label class="field"><span class="lbl">Score by</span><select id="rMetric">${Object.entries(METRIC_LBL).map(([v,l])=>`<option value="${v}" ${ui.metric===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <div class="tblwrap"><table><thead><tr><th>Team</th><th class="r">Trades</th><th class="r">Won-Lost</th><th class="r">Pts gained</th><th class="r">Pts given up</th><th class="r">Net</th></tr></thead><tbody>
  ${rows.map(r=>{const d=r.got-r.gave;return `<tr><td>${teamBlock(D.cur.team(r.rid))}</td><td class="r num">${r.n}</td><td class="r num">${r.w}-${r.l}</td><td class="r num">${fmt1(r.got)}</td><td class="r num">${fmt1(r.gave)}</td><td class="r num ${d>0?'w':d<0?'l':''}">${d>0?'+':''}${fmt1(d)}</td></tr>`}).join('')}
  </tbody></table></div>
  <div class="grid2">
    <div class="panel"><h3>Most lopsided</h3><ul class="rank">${lop.map(x=>line(x,'+'+fmt1(x.margin))).join('')||'<li>No scored trades yet.</li>'}</ul></div>
    <div class="panel"><h3>Most total production</h3><ul class="rank">${big.map(x=>line(x,fmt1(x.total))).join('')||'<li>No scored trades yet.</li>'}</ul></div>
  </div>
  <p class="note">Won-Lost compares each team's side with the average of the other sides. With three-team trades, points given up is that average.</p>`;
  $('#rMetric').onchange=e=>{ui.metric=e.target.value;renderRankings()};
}

const nextLeave=(pid,rid,after)=>(D.leaves[pid]||[]).find(e=>e.rid===rid&&e.created>after)||null;
const wkLbl=m=>`${m.season}${m.week?' wk '+m.week:''}`;
function wireData(metric){
  const key='wire-'+metric; if(D.prodMemo[key]) return D.prodMemo[key];
  const done=D.moves.filter(m=>m.status==='complete');
  const pickups=[],drops=[];
  for(const m of done){
    for(const pid of m.adds){
      const lv=nextLeave(pid,m.rid,m.created);
      pickups.push({m,pid,rid:m.rid,lv,pts:sumProd(pid,m.rid,m.k,lv?lv.k:Infinity,metric)});
    }
    for(const pid of m.drops){
      let after=0;for(const e of D.st[pid]||[]) if(e.k>=m.k&&e.rid!==m.rid) after+=metric==='start'?e.p:e.t;
      const next=(D.movesByPid[pid]||[]).find(x=>x.status==='complete'&&x.created>m.created&&x.adds.includes(pid)&&x.rid!==m.rid);
      drops.push({m,pid,rid:m.rid,after,next});
    }
  }
  return D.prodMemo[key]={done,pickups,drops};
}

function record(rid,opp,po){
  let w=0,l=0,t=0,pf=0,pa=0;const list=[];
  for(const g of D.games){
    let me,them;
    if(g.a.rid===rid&&(opp==null||g.b.rid===opp)){me=g.a;them=g.b}
    else if(g.b.rid===rid&&(opp==null||g.a.rid===opp)){me=g.b;them=g.a}
    else continue;
    if(po!=null&&g.po!==po) continue;
    pf+=me.pts;pa+=them.pts;
    if(me.pts>them.pts)w++;else if(me.pts<them.pts)l++;else t++;
    list.push({g,me,them});
  }
  return {w,l,t,pf,pa,list,n:w+l+t};
}
function renderH2H(){
  const F=D.frs;

    if(!rec.n) return `<td><button class="cell" data-pair="${r.rid},${c.rid}">0-0</button></td>`;
    const pct=(rec.w+rec.t/2)/rec.n;
    const col=pct>=.5?'var(--win)':'var(--loss)';const amt=Math.round(Math.abs(pct-.5)*2*45)+6;
    const sel=ui.a===r.rid&&ui.b===c.rid?' sel':'';

  }).join('')}</tr>`).join('');
  $('#main').innerHTML=`

  <div class="controls" style="margin-top:20px">

  renderPair();

async function renderWeek(){
  const lg=D.cur.league,st=D.state;
  const active=(lg.status==='in_season'||lg.status==='post_season')&&String(st.season)===D.cur.season;
  const week=active?Number(st.week):Math.max(...Object.keys(D.cur.matchups).map(Number),0);
  if(!week){$('#main').innerHTML='<h2 class="sec">This week</h2><p class="status">The season has not started yet.</p>';return}
  if(!$('#games')) $('#main').innerHTML=`<h2 class="sec">${active?'Week '+week:'Final week played: '+week}</h2><p class="sub" id="wsub">${active?'<span class="live"><i></i>Live scores refresh every minute while this tab is open.</span>':''}</p><div class="games" id="games"><p class="status">Loading scores...</p></div>`;
  let arr;
  try{arr=(await api(`/league/${lg.league_id}/matchups/${week}`)||[]).map(m=>({rid:m.roster_id,mid:m.matchup_id,pts:Number(m.custom_points??m.points??0)}))}
  catch(e){$('#games').innerHTML=`<p class="status err">${esc(e.message)}</p>`;return}
  if(view!=='week') return;
  const g={};for(const m of arr){if(m.mid==null)continue;(g[m.mid]=g[m.mid]||[]).push(m)}
  const seasonRec=rid=>{const r=D.cur.rosters.find(x=>x.rid===rid)?.s||{};return `${r.wins||0}-${r.losses||0}${r.ties?'-'+r.ties:''}`};
  $('#games').innerHTML=Object.values(g).filter(p=>p.length===2).map(([a,b])=>{
    const A=D.cur.team(a.rid),B=D.cur.team(b.rid),h=record(a.rid,b.rid);
    return `<div class="game">
      <div class="row ${a.pts>b.pts?'lead':''}">${teamBlock(A,seasonRec(a.rid))}<span class="score">${fmt1(a.pts)}</span></div>
      <div class="row ${b.pts>a.pts?'lead':''}">${teamBlock(B,seasonRec(b.rid))}<span class="score">${fmt1(b.pts)}</span></div>
      <div class="foot">All-time series: ${esc(A.name)} ${h.w}-${h.l}${h.t?'-'+h.t:''}</div></div>`}).join('')||'<p class="status">No matchups this week.</p>';
  if(active){const s=$('#wsub');if(s)s.innerHTML=`<span class="live"><i></i>Live. Updated ${new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'})}, refreshing every minute.</span>`}
  clearInterval(liveTimer);
  if(active) liveTimer=setInterval(()=>{if(view==='week'&&!document.hidden)renderWeek()},60000);
}

/* ---------- drawer: asset journeys ---------- */
const stack=[];
function tradeMini(t,hl){
  return `<div class="mini">${t.sides.map(sd=>`<div class="ms"><span>${esc(D.tname(t.season,sd.rid).name)} got</span>${[
    ...sd.players.map(p=>playerChip(p)),...sd.picks.map(pk=>pickChip(pk,t.season)),...(sd.faab?[`<span class="faab">$${sd.faab} FAAB</span>`]:[])].join('')||'<span class="faab">Nothing</span>'}</div>`).join('')}</div>`;
}
function tradeEvent(t,fromRid,toRid,what){
  return {c:t.created,html:`<li><div class="d">${fmtDate(t.created)} · ${t.season}${t.week?' wk '+t.week:''}</div><div class="h">${what?esc(what)+': ':''}${esc(D.tname(t.season,fromRid).name)} to ${esc(D.tname(t.season,toRid).name)}</div>${tradeMini(t)}</li>`};
}
function playerEvents(pid,after=0){
  return (D.playerTrades[pid]||[]).map(i=>D.trades[i]).filter(t=>t.created>after).map(t=>{
    const to=t.sides.find(s=>s.players.includes(pid));return tradeEvent(t,Number(t.drops[pid]),to.rid)});
}
function nowItem(pid){
  const r=D.holder[pid];
  return `<li class="now"><div class="d">Today</div><div class="h">${r!=null?'On '+esc(frName(r)):'Not on a roster in this league'}</div></li>`;
}
function playerJourney(pid){
  const [n,pos,nfl]=P(pid);
  const ev=[];const dp=D.draftedBy[pid];
  if(dp){
    const pickTraded=dp.key&&(D.pickTrades[dp.key]||[]).length;
    ev.push({c:dp.start||0,html:`<li class="draft"><div class="d">${dp.season} draft</div><div class="h">Picked ${esc(dp.label)} by ${esc(D.tname(dp.season,dp.rid).name)}</div>${pickTraded?`<button class="asset pick" data-asset="k:${esc(dp.key)}"><span class="pos PK">PICK</span><span class="nm">See how this pick changed hands (${pickTraded}x)</span></button>`:''}</li>`});
  }
  ev.push(...playerEvents(pid));
  for(const m of D.movesByPid[pid]||[]){
    if(m.status!=='complete') continue;
    const tm=esc(D.tname(m.season,m.rid).name),added=m.adds.includes(pid);
    ev.push({c:m.created,html:`<li class="wv"><div class="d">${fmtDate(m.created)} · ${wkLbl(m)}</div><div class="h">${added?(m.type==='waiver'?`${tm} claimed him off waivers${m.bid?' for $'+m.bid:''}`:`${tm} signed him as a free agent`):`${tm} dropped him`}</div></li>`});
  }
  ev.sort((a,b)=>a.c-b.c);
  const st=(D.st[pid]||[]),starts=st.filter(e=>e.s).length,sp=st.reduce((s,e)=>s+e.p,0),tp=st.reduce((s,e)=>s+e.t,0);
  return {title:n,body:`<p class="sub">${esc(pos)}${nfl?' · '+esc(nfl):''} · ${fmt1(tp)} pts while rostered in this league, ${fmt1(sp)} of them across ${starts} starts</p>
    <ol class="tl">${ev.map(e=>e.html).join('')||'<li><div class="h">No trades or roster moves in this league</div></li>'}${nowItem(pid)}</ol>`};
}
function pickJourney(key){
  const [season,round,orig]=key.split('-');
  const origT=D.tname(season in D.S?season:D.cur.season,Number(orig));
  const ev=(D.pickTrades[key]||[]).map(i=>D.trades[i]).map(t=>{
    const sd=t.sides.find(s=>s.picks.some(p=>p.key===key));const pk=sd.picks.find(p=>p.key===key);
    return tradeEvent(t,pk.from,sd.rid)});
  const e=D.pickIndex[key];let tail='';
  if(e&&e.pid){
    const [n,pos]=P(e.pid);
    tail=`<li class="draft"><div class="d">${e.season} draft</div><div class="h">${esc(D.tname(e.season,e.rid).name)} took ${esc(n)} at ${esc(e.label)}</div>${playerChip(e.pid)}</li>`
      +playerEvents(e.pid,e.start||0).map(x=>x.html).join('')+nowItem(e.pid);
  }else{
    const last=ev.length?(D.pickTrades[key]||[]).map(i=>D.trades[i]).pop().sides.find(s=>s.picks.some(p=>p.key===key)).rid:Number(orig);
    tail=`<li class="now"><div class="d">Today</div><div class="h">${e?'Slotted at '+esc(e.label)+', not used yet. ':'Not drafted yet. '}Owned by ${esc(frName(last))}</div></li>`;
  }
  return {title:`${season} Round ${round} pick`,body:`<p class="sub">Originally ${esc(origT.name)}'s pick. Traded ${ev.length} time${ev.length===1?'':'s'}.</p><ol class="tl">${ev.map(x=>x.html).join('')}${tail}</ol>`};
}
function openAsset(a,push=true){
  const kind=a[0],id=a.slice(2);
  const j=kind==='p'?playerJourney(id):kind==='t'?(t=>({title:'Trade, '+fmtDate(t.created),body:tradeCard(t)}))(D.trades.find(x=>x.id===id)):pickJourney(id);
  if(push) stack.push(a);
  $('#drawerRoot').innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(j.title)}">
    <header>${stack.length>1?'<button class="icon" id="dBack">Back</button>':''}<span class="t">${esc(j.title)}</span><button class="icon" data-close>Close</button></header>
    <div class="dbody">${j.body}<p class="note">Arrows read from the team that sent the asset to the team that received it.</p></div></aside>`;
  const b=$('#dBack');if(b)b.onclick=()=>{stack.pop();openAsset(stack[stack.length-1],false)};
  $('.drawer [data-close]').focus();
}
function closeDrawer(){stack.length=0;$('#drawerRoot').innerHTML=''}

/* ---------- routing & events ---------- */
function route(){
  const h=location.hash.slice(1);
  view=['trades','rank','wire','h2h','history','week'].includes(h)?h:'trades';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===view));
  if(!D) return;
  if(view!=='week') clearInterval(liveTimer);
  ({trades:renderTrades,rank:renderRankings,wire:renderWire,h2h:renderH2H,history:renderHistory,week:renderWeek})[view]();
}
window.addEventListener('hashchange',route);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{location.hash=t.dataset.view});
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-asset]');if(a&&D){openAsset(a.dataset.asset);return}
  const tr=e.target.closest('[data-trade]');if(tr&&D){openAsset('t:'+tr.dataset.trade);return}
  if(e.target.closest('[data-close]')) closeDrawer();
  const l=e.target.closest('[data-league]');if(l) loadLeague(l.dataset.league);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#connect').onsubmit=e=>{e.preventDefault();const v=$('#lid').value.trim();if(!v)return;
  if(/^\d{6,}$/.test(v)){ui.a=null;loadLeague(v)}else findLeagues(v)};
$('#refresh').onclick=()=>{const id=store.get('slp_league');if(!id)return;
  if(D) for(const s of D.seasons) if(s.league.status!=='complete') store.del('slp_s_'+s.league.league_id);
  loadLeague(id,true)};
const urlLeague=new URLSearchParams(location.search).get('league');
const startLeague=(urlLeague&&/^\d{6,}$/.test(urlLeague)?urlLeague:'')||store.get('slp_league')||DEFAULT_LEAGUE;
if(startLeague){$('#lid').value=startLeague;loadLeague(startLeague)}
</script>
</body>
